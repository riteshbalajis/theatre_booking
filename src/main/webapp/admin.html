<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Screenly | Admin</title><link rel="stylesheet" href="css/styles.css"></head>
<body data-page="admin">
  <div id="site-header"></div>
  <main class="page-shell"><section class="page-heading"><p class="eyebrow">Administration</p><h1>Manage the catalogue</h1><p class="muted">Create, update, and deactivate the resources supported by the booking system.</p></section><section class="admin-checkin-panel" aria-labelledby="ticket-checkin-title"><div><p class="eyebrow">Cinema entrance</p><h2 id="ticket-checkin-title">Check in ticket</h2><p class="muted">Enter the code from the customer's ticket QR code.</p></div><form id="ticket-checkin-form" class="admin-checkin-form"><label for="ticket-checkin-code">Ticket code</label><div class="admin-checkin-controls"><input id="ticket-checkin-code" name="ticketCode" type="text" autocomplete="off" placeholder="SCN-..." required><button id="ticket-checkin-button" class="button" type="submit">Verify ticket</button></div></form><div id="ticket-checkin-message" class="message" role="status"></div></section><nav id="admin-tabs" class="tabs" aria-label="Admin resources"><button class="tab active" data-resource="movies">Movies</button><button class="tab" data-resource="theatres">Theatres</button><button class="tab" data-resource="screens">Screens</button><button class="tab" data-resource="seats">Seats</button><button class="tab" data-resource="shows">Shows</button></nav><div id="admin-workspace" class="admin-workspace"></div><div id="page-message" class="message" role="status"></div></main>
  <script src="js/api.js"></script><script src="js/common.js"></script><script src="js/app.js"></script>
