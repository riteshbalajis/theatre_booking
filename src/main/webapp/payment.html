<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screenly | Payment</title>
  <link rel="stylesheet" href="css/styles.css">

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body data-page="payment">
  <div id="site-header"></div>

  <main class="auth-shell">
    <section class="form-panel">
      <p class="eyebrow">Confirm booking</p>
      <h1>Complete your booking</h1>
      <p class="muted">
        Pay securely with Razorpay to confirm your tickets.
      </p>

      <div class="booking-summary-card">
        <div class="summary-row">
          <span class="muted">Booking ID</span>
          <strong id="booking-id">Loading...</strong>
        </div>
        <div class="summary-row">
          <span class="muted">Total Payable</span>
          <strong class="price-highlight">₹<span id="booking-amount">0.00</span></strong>
        </div>
        <div class="summary-row timer-row">
          <span class="muted">Time remaining</span>
          <span id="countdown" class="countdown-badge">02:00</span>
        </div>
      </div>

      <div id="payment-message" class="message" role="alert"></div>

      <div class="payment-actions" style="margin-top: 20px; display: flex; flex-direction: column; gap: 12px;">
        <button id="pay-razorpay-btn" class="button button-block" type="button">
          Pay with Razorpay
        </button>
        <button id="cancel-payment-btn" class="button button-block danger" type="button">
          Cancel Booking
        </button>
      </div>

      <p class="form-footer">
        <a href="index.html">Cancel &amp; return to home</a>
      </p>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
