<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screenly | Theatres</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="theatres">
  <div id="site-header"></div>
  <main class="page-shell">
    <section class="section-heading page-heading">
      <div>
        <p class="eyebrow">Locations & Venues</p>
        <h1>Theatres</h1>
      </div>
      <form id="theatre-search" class="search-form">
        <input name="keyword" placeholder="Search theatre name" aria-label="Search theatres">
        <button class="button button-small" type="submit">Search</button>
      </form>
    </section>
    <div id="theatre-list" class="theatre-grid" aria-live="polite"></div>
    <div id="page-message" class="message" role="status"></div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
