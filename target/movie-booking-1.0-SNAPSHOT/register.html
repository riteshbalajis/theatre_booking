<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Screenly | Register</title><link rel="stylesheet" href="css/styles.css"></head>
<body data-page="register">
  <div id="site-header"></div>
  <main class="auth-shell"><section class="form-panel"><p class="eyebrow">Join Screenly</p><h1>Create your account</h1><form id="register-form" class="stack-form"><div id="registration-fields"><label>Name<input name="name" autocomplete="name" required></label><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Phone<input name="phone" type="tel" autocomplete="tel" required></label><label>Password<input name="password" type="password" minlength="8" autocomplete="new-password" required><small>Use at least 8 characters.</small></label></div><div id="form-message" class="message" role="alert"></div><button id="register-submit-button" class="button" type="submit">Create account</button></form><div id="registration-verification" style="display: none; margin-top: 24px;"><h2>Verify your email</h2><p class="muted">Enter the six-digit code sent to your email address.</p><form id="registration-verification-form" class="stack-form"><label>Email verification code<input id="registration-otp" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="000 000" class="totp-code-input" required></label><button id="registration-verify-button" class="button" type="submit">Verify email</button></form></div><p class="form-footer">Already registered? <a href="login.html">Log in</a></p></section></main>
  <script src="js/api.js"></script><script src="js/common.js"></script><script src="js/app.js"></script>
</body></html>
