<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Screenly | Select seats</title><link rel="stylesheet" href="css/styles.css"></head>
<body data-page="seats">
  <div id="site-header"></div>
  <main class="page-shell"><section class="section-heading page-heading"><div><p class="eyebrow">Almost there</p><h1>Select your seats</h1><p id="show-summary" class="muted"></p></div></section><div class="seat-layout"><section class="seat-panel"><div class="screen-label">SCREEN</div><div id="seat-map" class="seat-map" aria-live="polite"></div><div class="legend"><span><i class="seat-dot available"></i>Available</span><span><i class="seat-dot selected"></i>Selected</span><span><i class="seat-dot booked"></i>Booked</span></div></section><aside class="booking-summary"><h2>Your seats</h2><p id="selected-seats" class="muted">No seats selected</p><div class="summary-total"><span>Total</span><strong id="total-amount">0.00</strong></div><div id="page-message" class="message" role="status"></div><button id="confirm-booking" class="button" type="button" disabled>Confirm booking</button></aside></div></main>
  <script src="js/api.js"></script><script src="js/common.js"></script><script src="js/app.js"></script>
</body></html>
